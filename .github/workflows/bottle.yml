# Bottles a formula of the tap on request, without going through a pull
# request: it is how a formula that nothing has changed gets its first
# bottle, and stopt needs one before smspp can have its own, since a formula
# whose dependencies have no bottle is skipped by brew test-bot.

name: bottle

on:
  workflow_dispatch:
    inputs:
      formula:
        description: the formula to bottle
        required: true
        default: stopt

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      # not brew test-bot: its linkage check fails on a library that comes
      # from an indirect dependency (libz, which on Linux is provided by
      # zlib-ng-compat), and that would throw away a bottle that is good
      - name: it is built, it runs and it is bottled
        working-directory: ${{ runner.temp }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          f="smspp-project/smspp/${{ inputs.formula }}"
          brew install --build-bottle --formula "$f"
          brew test "$f"
          brew bottle --json --no-rebuild \
              --root-url=https://ghcr.io/v2/smspp-project/smspp "$f"

      - name: the bottle travels to the job that publishes it
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: ${{ runner.temp }}/*.bottle.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main
        with:
          username: dmeoli

      - name: the bottles of the three platforms come back together
        uses: actions/download-artifact@v4
        with:
          pattern: bottles_*
          merge-multiple: true
          path: ${{ runner.temp }}/bottles

      - name: they go to ghcr.io and their sha256 into the formula
        working-directory: ${{ runner.temp }}/bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.HOMEBREW_GITHUB_PACKAGES_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: dmeoli
        run: |
          brew pr-upload --debug --root-url=https://ghcr.io/v2/smspp-project/smspp

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: master

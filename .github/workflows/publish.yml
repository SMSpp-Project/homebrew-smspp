# When brew test-bot has built and bottled a pull request, the bottles it
# produced are uploaded to the packages of the organisation and the formula
# gets their sha256, so that whoever installs from the tap downloads a binary
# instead of compiling.

name: publish

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

permissions:
  contents: read

jobs:
  bottles:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main
        with:
          username: dmeoli

      - name: the bottles go to ghcr.io and their sha256 into the formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.HOMEBREW_GITHUB_PACKAGES_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: dmeoli
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          brew pr-pull --debug --tap="$GITHUB_REPOSITORY" \
              --root-url=https://ghcr.io/v2/smspp-project/smspp "$PR"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: master

# The formulae of the tap are built and tested by brew test-bot, on the
# macOS runners and on Linux, the way homebrew-core tests a pull request.

name: brew test-bot

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is a Tier 3 configuration for Homebrew now: there are no
        # bottles for it even among the dependencies, so nothing can be built
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # the formulae the pull request touches are built, run and bottled by
      # hand rather than by brew test-bot, whose linkage check fails on a
      # library that comes from an indirect dependency (libz)
      - name: the formulae of the pull request are built, run and bottled
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- Formula \
                    | sed 's|Formula/||; s|\.rb$||')
          cd "$RUNNER_TEMP"
          echo "the pull request touches: $changed"
          for n in $changed; do
            f="smspp-project/smspp/$n"
            brew install --build-bottle --formula "$f"
            brew test "$f"
            brew bottle --json --no-rebuild \
                --root-url=https://ghcr.io/v2/smspp-project/smspp "$f"
          done

      - name: the bottle travels to the job that publishes it
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: ${{ runner.temp }}/*.bottle.*
          if-no-files-found: ignore
